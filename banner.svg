<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Ziad Sayed Ahmed – Data Science, Machine Learning, Analytics" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset=".55" stop-color="#0d1233"/><stop offset="1" stop-color="#1a1050"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67E8F9" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx=".85" cy=".2" r=".6">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="280" rx="14" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="999" height="279" rx="14" fill="none" stroke="#67E8F9" stroke-opacity=".25"/>

  <text x="56" y="92" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="14" letter-spacing="4" fill="#67E8F9">// DATA · LOGIC · INSIGHT</text>
  <text x="54" y="152" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">Ziad Sayed Ahmed</text>
  <text x="56" y="194" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B6C2E2">Data Science  ·  Machine Learning  ·  Analytics</text>

  <!-- animated signal line -->
  <path d="M520 232 L580 232 L610 232 L630 205 L650 250 L675 170 L700 245 L725 215 L760 215 L800 190 L840 200 L880 150 L920 160 L950 118"
        fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="900" stroke-dashoffset="900">
    <animate attributeName="stroke-dashoffset" values="900;0;0;900" keyTimes="0;.55;.9;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <circle cx="950" cy="118" r="5" fill="#67E8F9">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
